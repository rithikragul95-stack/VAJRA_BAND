; Vajra Band — ESP32 Edge AI firmware
[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_src_filter =
    +<*.cpp>
    +<*.ino>
    +<*.h>
    -<train_model.py>
    -<*.csv>
    -<index.html>
    -<style.css>
    -<app.js>

build_flags =
    -DVAJRA_EDGE_AI=1
    -DVAJRA_SIMULATION=1
    -DVAJRA_DEBUG=1
    -Os
    -DCORE_DEBUG_LEVEL=0

